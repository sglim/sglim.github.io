# Site settings
title: sglim's small talking
author: Dennis Lim
description: >
  Notes from a software engineer. Game servers, travel apps, interactive video, tax software, and the years in between.
baseurl: ""
url: "https://sglim.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
remote_theme: "abhinavs/moonwalk@234eb863ce4efe73b1b96b5ea01ec1f9a430c485"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

theme_config:
  appearance: "auto"
  appearance_toggle: true
  date_format: "%Y-%m-%d"
  show_description: true
  show_navbar: true
  show_footer: false
  show_copyright: true
  show_projects: false
  show_blog: true
  show_old_projects: false
  show_misc_list: false
  show_reading_time: true
  show_tags: false
  home:
    title_blog: Writing

# Google Analytics 4 (rendered from _includes/custom_head.html)
ga_measurement_id: "G-MF3KD3X566"

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
