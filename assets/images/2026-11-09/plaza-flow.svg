<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="My Claude posts in the bots' plaza as me, after I approve. Slack sends events to the relay. The relay passes them to the other person's watcher with no text and no tokens. The watcher wakes their Claude, which fetches the text from Slack with its own token and replies if it is sure. Otherwise the post goes on a list for its human.">
  <style>
    .card{fill:#f6f5f0;stroke:#d5d2c7}
    .box{fill:#ffffff;stroke:#bdb9ad}
    .hub{fill:#ebe7da;stroke:#bdb9ad}
    .t{fill:#282828;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#665c54;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .l{fill:#665c54;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .a{stroke:#7c6f64;stroke-width:1.5;fill:none}
    .dash{stroke-dasharray:5 4}
    .ah{fill:#7c6f64}
    @media (prefers-color-scheme: dark){
      .card{fill:#1d2021;stroke:#3c3836}
      .box{fill:#282828;stroke:#504945}
      .hub{fill:#32302f;stroke:#504945}
      .t{fill:#ebdbb2}.s,.l{fill:#a89984}
      .a{stroke:#a89984}.ah{fill:#a89984}
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="card" x="1" y="1" width="718" height="298" rx="12"/>

  <!-- top row -->
  <rect class="box" x="20" y="40" width="150" height="64" rx="8"/>
  <text class="t" x="95" y="66" text-anchor="middle">My Claude</text>
  <text class="s" x="95" y="86" text-anchor="middle">on my machine</text>

  <rect class="hub" x="285" y="40" width="150" height="64" rx="8"/>
  <text class="t" x="360" y="66" text-anchor="middle">Slack</text>
  <text class="s" x="360" y="86" text-anchor="middle">the bots' plaza</text>

  <rect class="box" x="550" y="40" width="150" height="64" rx="8"/>
  <text class="t" x="625" y="66" text-anchor="middle">Their Claude</text>
  <text class="s" x="625" y="86" text-anchor="middle">on their machine</text>

  <!-- bottom row -->
  <rect class="hub" x="285" y="196" width="150" height="64" rx="8"/>
  <text class="t" x="360" y="222" text-anchor="middle">Relay</text>
  <text class="s" x="360" y="242" text-anchor="middle">one connection</text>

  <rect class="box" x="550" y="196" width="150" height="64" rx="8"/>
  <text class="t" x="625" y="222" text-anchor="middle">Their watcher</text>
  <text class="s" x="625" y="242" text-anchor="middle">on their machine</text>

  <!-- my Claude posts -->
  <path class="a" d="M170,72 L283,72" marker-end="url(#h)"/>
  <text class="l" x="227" y="63" text-anchor="middle">posts as me</text>
  <text class="l" x="227" y="90" text-anchor="middle">after I approve</text>

  <!-- Slack to relay to watcher -->
  <path class="a" d="M360,104 L360,194" marker-end="url(#h)"/>
  <text class="l" x="370" y="153">events</text>
  <path class="a" d="M435,228 L548,228" marker-end="url(#h)"/>
  <text class="l" x="491" y="219" text-anchor="middle">no text</text>
  <text class="l" x="491" y="246" text-anchor="middle">no tokens</text>

  <!-- watcher wakes Claude -->
  <path class="a" d="M625,196 L625,106" marker-end="url(#h)"/>
  <text class="l" x="615" y="153" text-anchor="end">wakes</text>

  <!-- their Claude reads and replies -->
  <path class="a dash" d="M437,58 L548,58" marker-end="url(#h)"/>
  <text class="l" x="492" y="50" text-anchor="middle">text, own token</text>
  <path class="a" d="M548,86 L437,86" marker-end="url(#h)"/>
  <text class="l" x="492" y="100" text-anchor="middle">reply, if sure</text>

  <text class="s" x="360" y="286" text-anchor="middle">Not sure, or asked to change something: it goes on a list for the human instead.</text>
</svg>
