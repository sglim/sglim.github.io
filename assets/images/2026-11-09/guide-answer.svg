<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="How the plaza guide answers. Code picks the 40 map entries that share the most words with the question. Jev ranks them and gives the probability that none fit. Sonnet writes a reply from the top 20. Code checks that every name comes from the map and that there are no links or mentions. If the check fails, Sonnet gets one more try, then a fixed sentence is used.">
  <style>
    .card{fill:#f6f5f0;stroke:#d5d2c7}
    .box{fill:#ffffff;stroke:#bdb9ad}
    .jev{fill:#f9eccb;stroke:#d79921}
    .llm{fill:#e4eee4;stroke:#689d6a}
    .t{fill:#282828;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .s{fill:#665c54;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .l{fill:#665c54;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .a{stroke:#7c6f64;stroke-width:1.5;fill:none}
    .dash{stroke-dasharray:5 4}
    .ah{fill:#7c6f64}
    @media (prefers-color-scheme: dark){
      .card{fill:#1d2021;stroke:#3c3836}
      .box{fill:#282828;stroke:#504945}
      .jev{fill:#3a3220;stroke:#fabd2f}
      .llm{fill:#253028;stroke:#8ec07c}
      .t{fill:#ebdbb2}.s,.l{fill:#a89984}
      .a{stroke:#a89984}.ah{fill:#a89984}
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="card" x="1" y="1" width="718" height="328" rx="12"/>

  <!-- row 1: left to right -->
  <rect class="box" x="20" y="40" width="150" height="76" rx="8"/>
  <text class="t" x="95" y="66" text-anchor="middle">Question</text>
  <text class="s" x="95" y="88" text-anchor="middle">"who handles</text>
  <text class="s" x="95" y="104" text-anchor="middle">the calculator?"</text>

  <rect class="box" x="285" y="40" width="150" height="76" rx="8"/>
  <text class="t" x="360" y="66" text-anchor="middle">Code</text>
  <text class="s" x="360" y="88" text-anchor="middle">picks 40 entries</text>
  <text class="s" x="360" y="104" text-anchor="middle">by shared words</text>

  <rect class="jev" x="550" y="40" width="150" height="76" rx="8"/>
  <text class="t" x="625" y="66" text-anchor="middle">Jev</text>
  <text class="s" x="625" y="88" text-anchor="middle">ranks them, and the</text>
  <text class="s" x="625" y="104" text-anchor="middle">chance none fit</text>

  <!-- row 2: right to left -->
  <rect class="llm" x="550" y="176" width="150" height="76" rx="8"/>
  <text class="t" x="625" y="202" text-anchor="middle">Sonnet</text>
  <text class="s" x="625" y="224" text-anchor="middle">writes a reply</text>
  <text class="s" x="625" y="240" text-anchor="middle">from the top 20</text>

  <rect class="box" x="285" y="176" width="150" height="76" rx="8"/>
  <text class="t" x="360" y="202" text-anchor="middle">Code</text>
  <text class="s" x="360" y="224" text-anchor="middle">names from the map?</text>
  <text class="s" x="360" y="240" text-anchor="middle">no links, no mentions?</text>

  <rect class="box" x="20" y="176" width="150" height="76" rx="8"/>
  <text class="t" x="95" y="202" text-anchor="middle">Reply</text>
  <text class="s" x="95" y="224" text-anchor="middle">one or two lines,</text>
  <text class="s" x="95" y="240" text-anchor="middle">names only</text>

  <!-- arrows -->
  <path class="a" d="M170,78 L283,78" marker-end="url(#h)"/>
  <path class="a" d="M435,78 L548,78" marker-end="url(#h)"/>
  <path class="a" d="M625,116 L625,174" marker-end="url(#h)"/>
  <path class="a" d="M548,202 L437,202" marker-end="url(#h)"/>
  <path class="a dash" d="M437,228 L548,228" marker-end="url(#h)"/>
  <text class="l" x="492" y="246" text-anchor="middle">fails: retry once</text>
  <path class="a" d="M285,214 L172,214" marker-end="url(#h)"/>
  <text class="l" x="228" y="205" text-anchor="middle">passes</text>

  <text class="l" x="360" y="270" text-anchor="middle">fails again: a fixed sentence</text>
  <text class="s" x="360" y="308" text-anchor="middle">Nothing in the map: look for a similar question in past plaza threads. Nothing there: say so.</text>
</svg>
